[project]
name = "multiagent-memory-benchmark"
version = "0.1.0"
description = "A two-arm evaluation of four graph-based RAG frameworks on multi-hop question answering."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.46",
    "openai>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "lightrag-hku>=1.5.0",
    # O Cognee é importado pelo caminho de RECUPERAÇÃO, que corre no ambiente
    # principal — `benchmark.methods.cognee.adapter` faz `import cognee`. Só a
    # INDEXAÇÃO é que corre no `.venvs/cognee`, por subprocesso, e é essa que
    # precisa do `neo4j<6`.
    #
    # Estava instalado à mão no ambiente original e nunca foi declarado aqui.
    # O `uv sync` produzia um ambiente sem ele, e o leitor do Cognee morria com
    # `ModuleNotFoundError: No module named 'cognee'` — um dos cinco métodos do
    # critério de aceite, sem recuperação nenhuma. Descoberto a 2026-08-09, ao
    # correr o método pela primeira vez a partir de um ambiente reconstruído.
    "cognee==1.1.2",
    "neo4j>=6.2.0",
    "matplotlib>=3.11.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
benchmark = "benchmark.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
